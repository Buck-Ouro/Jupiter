name: WU Probe (diagnostic)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx
      - name: Run probe
        env:
          UNLOCKER_KEY: ${{ secrets.UNLOCKER_KEY }}
        run: python neutrl_probe.py
      - name: Upload rendered HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutrl-render
          path: neutrl_render.html
          if-no-files-found: ignore
